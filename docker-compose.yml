services:
  postgres:
    image: postgres:16-alpine
    container_name: association-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-association_manager}
      POSTGRES_USER: ${POSTGRES_USER:-association_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-association_manager} -d ${POSTGRES_DB:-association_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
