server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: association-manager-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/association_manager}
    username: ${DB_USERNAME:association_manager}
    password: ${DB_PASSWORD:change-me-local-only}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    # Development-only default. Set a unique secret of at least 32 characters in production.
    jwt-secret: ${JWT_SECRET:dev-only-change-this-jwt-secret-before-deployment-2026}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
