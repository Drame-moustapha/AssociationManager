server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: association-manager-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/association_manager}
    username: ${DB_USERNAME:association_manager}
    password: ${DB_PASSWORD:change-me-local-only}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
